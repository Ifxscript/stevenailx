<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/favicon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SteveNailX</title>

    <!-- Social Preview Metadata (Open Graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stevenailx.com/" />
    <meta property="og:title" content="SteveNailX" />
    <meta property="og:description" content="Elevate your style with professional nail care, artistry, and premium grooming. Visit us at Saham Plaza, Shop A20, Abuja." />
    <meta property="og:image" content="https://stevenailx.com/social-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Social Preview Metadata (Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://stevenailx.com/" />
    <meta name="twitter:title" content="SteveNailX" />
    <meta name="twitter:description" content="Elevate your style with professional nail care, artistry, and premium grooming. Visit us at Saham Plaza, Shop A20, Abuja." />
    <meta name="twitter:image" content="https://stevenailx.com/social-preview.jpg" />

    <!-- Additional Meta Tags -->
    <meta name="description" content="SteveNailX is Abuja's premier destination for artistic nail designs, manicures, and beauty services." />
    <meta name="keywords" content="nails, abuja, nail art, manicures, salon, beauty, stevenailx" />

    <!-- Preconnect to external services to reduce DNS/TLS time on mobile -->
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://www.googleapis.com" />
    <link rel="preconnect" href="https://securetoken.googleapis.com" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    <link rel="dns-prefetch" href="https://i.ibb.co" />
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />
    <link rel="preconnect" href="https://js.paystack.co" />
    <link rel="dns-prefetch" href="https://api.paystack.co" />

    <!-- Loader font: loaded here so it's available before the JS bundle -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400&display=swap" />

    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        background: #FFFAF7;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.45s ease;
      }
      #app-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .loader-logo-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .loader-logo-monogram {
        width: 28px;
        height: 28px;
        background-color: #8C8688;
        mask: url(/src/assets/IMG_8009-removebg-preview.png) no-repeat center;
        -webkit-mask: url(/src/assets/IMG_8009-removebg-preview.png) no-repeat center;
        mask-size: contain;
        -webkit-mask-size: contain;
      }
      .loader-logo-name {
        font-family: 'DM Sans', 'Segoe UI', Roboto, sans-serif;
        font-size: 0.85rem;
        font-weight: 400;
        color: #8C8688;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <div id="app-loader">
      <div class="loader-logo-wrapper">
        <div class="loader-logo-monogram"></div>
        <span class="loader-logo-name">SteveNailX</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
